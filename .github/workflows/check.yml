name: Existing checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix ui ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run check:ui
      - run: npm run build:ui
      - run: npm test
